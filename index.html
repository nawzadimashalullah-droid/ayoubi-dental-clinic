
<!DOCTYPE html>
<html lang="ps">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayoubi Dental Clinic</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2'"></script>

<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:14px;color:#172554}
.container{max-width:1000px;margin:auto}
header{background:#087e8b;color:white;padding:20px;text-align:center;border-radius:12px}
.card{background:white;padding:16px;border-radius:12px;margin:14px 0;box-shadow:0 2px 8px #ddd}
input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;border:1px solid #ccc;border-radius:7px}
.password-wrap{display:flex;gap:6px;align-items:center}
.password-wrap input{flex:1;min-width:0}
.password-wrap button{margin:6px 0 12px}
button{padding:10px 14px;background:#087e8b;color:white;border:0;border-radius:7px;margin:3px;cursor:pointer}
button:disabled{opacity:.6}
.danger{background:#c62828}
.secondary{background:#64748b}
.hidden{display:none!important}
table{width:100%;border-collapse:collapse;min-width:650px}
td,th{border:1px solid #ddd;padding:8px;text-align:left}
th{background:#e0f2f1}
.table-wrap{overflow-x:auto}
img{max-width:150px;max-height:150px;margin:6px;border-radius:7px}
.status{font-weight:bold}
</style>
</head>

<body>
<div class="container">

<header>
<h1>Ayoubi Dental Clinic</h1>
<p>Patient Management System</p>
</header>

<!-- LOGIN -->
<div class="card" id="loginBox">
<h2>Login</h2>

<label>Email</label>
<input id="email" type="email" placeholder="Email" autocomplete="username">

<label>Password</label>
<div class="password-wrap">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button type="button" class="secondary" id="togglePasswordBtn">👁️</button>
</div>

<button type="button" id="loginButton">Login</button>
<p id="loginMessage"></p>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">

<div class="card">
<h2>Dashboard</h2>
<button type="button" onclick="logout()">Logout</button>
<p id="message"></p>
</div>

<!-- PATIENT FORM -->
<div class="card">
<h2 id="formTitle">Register New Patient</h2>

<label>Patient Full Name</label>
<input id="full_name" placeholder="Full Name">

<label>Phone Number</label>
<input id="phone" placeholder="Phone Number">

<label>Age</label>
<input id="age" type="number" placeholder="Age">

<label>Gender</label>
<select id="gender">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<label>Registration Date</label>
<input id="registration_date" type="date">

<label>Chief Complaint</label>
<textarea id="chief_complaint"></textarea>

<label>Diagnosis</label>
<textarea id="diagnosis"></textarea>

<label>Tooth Number</label>
<input id="tooth_number" placeholder="Example: 11, 16, 36">

<label>Treatment Performed</label>
<textarea id="treatment"></textarea>

<label>Prescription and Medication</label>
<textarea id="prescription"></textarea>

<label>Next Appointment Date</label>
<input id="next_appointment" type="date">

<label>Medical History</label>
<textarea id="medical_history"></textarea>

<label>Address</label>
<textarea id="address"></textarea>

<label>Dental Photos and X-rays</label>
<input id="dentalFiles" type="file" accept="image/*" multiple>

<button type="button" onclick="savePatient()" id="saveButton">Save Patient</button>
<button type="button" onclick="cancelEdit()" id="cancelButton" class="secondary hidden">Cancel Edit</button>
</div>

<!-- APPOINTMENTS -->
<div class="card" id="appointmentsCard">
<h2 id="appointmentFormTitle">Appointment Management</h2>

<label>Select Patient</label>
<select id="appointment_patient">
<option value="">Select a patient</option>
</select>

<label>Appointment Date</label>
<input id="appointment_date" type="date">

<label>Appointment Time</label>
<input id="appointment_time" type="time">

<label>Reason for Appointment</label>
<textarea id="appointment_reason"></textarea>

<label>Status</label>
<select id="appointment_status">
<option value="Scheduled">Scheduled</option>
<option value="Completed">Completed</option>
<option value="Cancelled">Cancelled</option>
</select>

<label>Notes</label>
<textarea id="appointment_notes"></textarea>

<button type="button" onclick="saveAppointment()" id="appointmentSaveButton">Save Appointment</button>
<button type="button" onclick="cancelAppointmentEdit()" id="appointmentCancelButton" class="secondary hidden">Cancel Edit</button>

<p id="appointmentMessage"></p>
</div>

<!-- APPOINTMENTS LIST -->
<div class="card">
<h2>Appointments List</h2>

<label>Filter by date</label>
<input id="appointmentFilterDate" type="date" onchange="renderAppointments()">
<button type="button" class="secondary" onclick="clearAppointmentFilter()">Show All</button>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Patient</th>
<th>Phone</th>
<th>Date</th>
<th>Time</th>
<th>Reason</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="appointmentRows"></tbody>
</table>
</div>
</div>

<!-- PATIENT RECORDS -->
<div class="card">
<h2>Patient Records</h2>
<input id="search" placeholder="Search name or phone" oninput="renderPatients()">

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Age</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="patientRows"></tbody>
</table>
</div>
</div>

<!-- PATIENT DETAILS -->
<div class="card hidden" id="detailsBox">
<h2>Patient Details</h2>
<div id="detailsContent"></div>

<h3>Dental Photos and X-rays</h3>
<div id="imageContent"></div>

<button type="button" onclick="document.getElementById('detailsBox').classList.add('hidden')">Close</button>
</div>

</div>
</div>

<script>
/* SUPABASE SETTINGS */
const SUPABASE_URL="https://qrmgjgzgvbisuhqimqmd.supabase.co";
const SUPABASE_KEY="sb_publishable_DRumx3hmN-hbGf63QrAlAg_USLgJ_mx";

let db=null;

if(window.supabase && window.supabase.createClient){
 db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{
   persistSession:true,
   storage:window.sessionStorage,
   autoRefreshToken:true,
   detectSessionInUrl:true
  }
 });
}

/* GLOBAL VARIABLES */
let patients=[];
let appointments=[];
let editingId=null;
let editingAppointmentId=null;

const SESSION_LIMIT_MS=60*60*1000;
let logoutTimer=null;
let isLoggingOut=false;

/* BASIC FUNCTIONS */
function msg(t){
 document.getElementById("message").textContent=t;
}

function appointmentMsg(t){
 document.getElementById("appointmentMessage").textContent=t;
}

function val(id){
 return document.getElementById(id).value.trim();
}

function setVal(id,v){
 document.getElementById(id).value=v??"";
}

/* SHOW / HIDE PASSWORD */
function togglePassword(){
 const password=document.getElementById("password");
 const button=document.getElementById("togglePasswordBtn");

 if(password.type==="password"){
  password.type="text";
  button.textContent="🙈";
 }else{
  password.type="password";
  button.textContent="👁️";
 }
}

document.getElementById("togglePasswordBtn").addEventListener("click",togglePassword);

/* SESSION TIMER */
function startSessionTimer(){
 if(logoutTimer) clearTimeout(logoutTimer);

 let startedAt=Number(sessionStorage.getItem("clinicLoginTime"));

 if(!startedAt){
  startedAt=Date.now();
  sessionStorage.setItem("clinicLoginTime",String(startedAt));
 }

 const remaining=SESSION_LIMIT_MS-(Date.now()-startedAt);

 if(remaining<=0){
  logout();
  return;
 }

 logoutTimer=setTimeout(()=>logout(),remaining);
}

/* LOGIN */
async function login(){
 const button=document.getElementById("loginButton");
 const loginMessage=document.getElementById("loginMessage");

 if(!db){
  loginMessage.textContent="Supabase could not load. Please refresh the page.";
  return;
 }

 const email=val("email");
 const password=document.getElementById("password").value;

 if(!email||!password){
  loginMessage.textContent="Please enter email and password.";
  return;
 }

 button.disabled=true;
 button.textContent="Logging in...";
 loginMessage.textContent="";

 try{
  const {error}=await db.auth.signInWithPassword({email,password});

  if(error){
   loginMessage.textContent=error.message;
   return;
  }

  sessionStorage.setItem("clinicLoginTime",String(Date.now()));
  await showApp();

 }catch(error){
  loginMessage.textContent="Login failed: "+error.message;
 }finally{
  button.disabled=false;
  button.textContent="Login";
 }
}

document.getElementById("loginButton").addEventListener("click",login);

/* SHOW DASHBOARD */
async function showApp(){
 startSessionTimer();

 document.getElementById("loginBox").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");

 await loadPatients();
 await loadAppointments();

 msg("Login successful");
}

/* LOGOUT */
async function logout(){
 if(isLoggingOut)return;
 isLoggingOut=true;

 if(logoutTimer) clearTimeout(logoutTimer);
 logoutTimer=null;

 sessionStorage.removeItem("clinicLoginTime");

 try{
  if(db) await db.auth.signOut();
 }catch(error){
  console.log(error);
 }

 document.getElementById("app").classList.add("hidden");
 document.getElementById("loginBox").classList.remove("hidden");

 document.getElementById("password").value="";
 document.getElementById("password").type="password";
 document.getElementById("togglePasswordBtn").textContent="👁️";
 document.getElementById("loginMessage").textContent="";

 patients=[];
 appointments=[];

 cancelEdit();
 cancelAppointmentEdit();

 isLoggingOut=false;
}

/* LOAD PATIENTS */
async function loadPatients(){
 const {data,error}=await db
  .from("Patients")
  .select("*")
  .order("id",{ascending:false});

 if(error){
  msg("Load failed: "+error.message);
  return;
 }

 patients=data||[];
 renderPatients();
 populateAppointmentPatients();
}

/* PATIENT DROPDOWN */
function populateAppointmentPatients(){
 const select=document.getElementById("appointment_patient");
 const current=select.value;

 select.replaceChildren();

 const first=document.createElement("option");
 first.value="";
 first.textContent="Select a patient";
 select.appendChild(first);

 patients.forEach(p=>{
  const option=document.createElement("option");
  option.value=p.id;
  option.textContent=(p.full_name||"Unnamed")+" — "+(p.phone||"No phone");
  select.appendChild(option);
 });

 if(patients.some(p=>String(p.id)===String(current))){
  select.value=current;
 }
}

/* RENDER PATIENTS */
function renderPatients(){
 const search=val("search").toLowerCase();
 const body=document.getElementById("patientRows");

 body.replaceChildren();

 patients.filter(p=>
  String(p.full_name||"").toLowerCase().includes(search)||
  String(p.phone||"").toLowerCase().includes(search)
 ).forEach(p=>{
  const tr=document.createElement("tr");

  [p.full_name,p.phone,p.age].forEach(v=>{
   const td=document.createElement("td");
   td.textContent=v??"";
   tr.appendChild(td);
  });

  const actions=document.createElement("td");

  const detail=document.createElement("button");
  detail.textContent="Details";
  detail.onclick=()=>showDetails(p);

  const edit=document.createElement("button");
  edit.textContent="Edit";
  edit.onclick=()=>editPatient(p);

  const del=document.createElement("button");
  del.textContent="Delete";
  del.className="danger";
  del.onclick=()=>deletePatient(p.id);

  actions.append(detail,edit,del);
  tr.appendChild(actions);
  body.appendChild(tr);
 });
}

/* EDIT PATIENT */
function editPatient(p){
 editingId=p.id;

 const fields=[
  "full_name","phone","age","gender","registration_date",
  "chief_complaint","diagnosis","tooth_number","treatment",
  "prescription","next_appointment","medical_history","address"
 ];

 fields.forEach(k=>setVal(k,p[k]));

 document.getElementById("formTitle").textContent="Edit Patient";
 document.getElementById("saveButton").textContent="Update Patient";
 document.getElementById("cancelButton").classList.remove("hidden");

 window.scrollTo({top:0,behavior:"smooth"});
}

/* CANCEL PATIENT EDIT */
function cancelEdit(){
 editingId=null;

 [
  "full_name","phone","age","gender","registration_date",
  "chief_complaint","diagnosis","tooth_number","treatment",
  "prescription","next_appointment","medical_history","address"
 ].forEach(k=>setVal(k,""));

 document.getElementById("dentalFiles").value="";
 document.getElementById("formTitle").textContent="Register New Patient";
 document.getElementById("saveButton").textContent="Save Patient";
 document.getElementById("cancelButton").classList.add("hidden");
}

/* UPLOAD PATIENT IMAGES */
async function uploadImages(patientId,oldPaths){
 const files=Array.from(document.getElementById("dentalFiles").files||[]);

 if(!files.length)return oldPaths||[];

 const {data:{user},error:userError}=await db.auth.getUser();

 if(userError||!user)throw new Error("Please login again.");

 const paths=[...(oldPaths||[])];

 for(const file of files){
  if(!file.type.startsWith("image/"))continue;

  if(file.size>10*1024*1024){
   throw new Error("Each image must be smaller than 10 MB.");
  }

  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path=user.id+"/"+patientId+"/"+Date.now()+"-"+safeName;

  const {error}=await db.storage
   .from("patient-images")
   .upload(path,file);

  if(error)throw error;

  paths.push(path);
 }

 return paths;
}

/* SAVE PATIENT */
async function savePatient(){
 const full_name=val("full_name");

 if(!full_name){
  alert("Please enter patient name.");
  return;
 }

 const patient={
  full_name,
  phone:val("phone"),
  age:val("age")?Number(val("age")):null,
  gender:val("gender"),
  registration_date:val("registration_date")||new Date().toISOString().slice(0,10),
  chief_complaint:val("chief_complaint"),
  diagnosis:val("diagnosis"),
  tooth_number:val("tooth_number"),
  treatment:val("treatment"),
  prescription:val("prescription"),
  next_appointment:val("next_appointment")||null,
  medical_history:val("medical_history"),
  address:val("address")
 };

 try{
  let patientId=editingId;
  let oldPaths=[];

  if(editingId!==null){
   const old=patients.find(p=>p.id===editingId);
   oldPaths=old?.dental_images||[];

   const {error}=await db
    .from("Patients")
    .update(patient)
    .eq("id",editingId);

   if(error)throw error;

  }else{
   const {data,error}=await db
    .from("Patients")
    .insert([patient])
    .select()
    .single();

   if(error)throw error;
   patientId=data.id;
  }

  const paths=await uploadImages(patientId,oldPaths);

  if(paths.length){
   const {error}=await db
    .from("Patients")
    .update({dental_images:paths})
    .eq("id",patientId);

   if(error)throw error;
  }

  msg(editingId!==null?"Patient updated successfully":"Patient saved successfully");

  cancelEdit();
  await loadPatients();

 }catch(error){
  msg("Save failed: "+error.message);
 }
}

/* DELETE PATIENT */
async function deletePatient(id){
 if(!confirm("Are you sure you want to delete this patient?"))return;

 const {error}=await db
  .from("Patients")
  .delete()
  .eq("id",id);

 if(error){
  msg("Delete failed: "+error.message);
  return;
 }

 msg("Patient deleted successfully");
 await loadPatients();
 await loadAppointments();
}

/* PATIENT DETAILS */
async function showDetails(p){
 const box=document.getElementById("detailsBox");
 const content=document.getElementById("detailsContent");
 const imageContent=document.getElementById("imageContent");

 content.replaceChildren();
 imageContent.replaceChildren();

 const fields=[
  ["Name",p.full_name],
  ["Phone",p.phone],
  ["Age",p.age],
  ["Gender",p.gender],
  ["Registration Date",p.registration_date],
  ["Chief Complaint",p.chief_complaint],
  ["Diagnosis",p.diagnosis],
  ["Tooth Number",p.tooth_number],
  ["Treatment",p.treatment],
  ["Prescription",p.prescription],
  ["Next Appointment",p.next_appointment],
  ["Medical History",p.medical_history],
  ["Address",p.address]
 ];

 fields.forEach(([label,value])=>{
  const para=document.createElement("p");
  const strong=document.createElement("strong");
  strong.textContent=label+": ";
  para.append(strong,document.createTextNode(value??""));
  content.appendChild(para);
 });

 const paths=p.dental_images||[];

 if(!paths.length){
  imageContent.textContent="No images uploaded.";
 }else{
  for(const path of paths){
   const {data,error}=await db.storage
    .from("patient-images")
    .createSignedUrl(path,3600);

   if(error)continue;

   const link=document.createElement("a");
   link.href=data.signedUrl;
   link.target="_blank";
   link.rel="noopener";

   const img=document.createElement("img");
   img.src=data.signedUrl;
   img.alt="Dental image";

   link.appendChild(img);
   imageContent.appendChild(link);
  }
 }

 box.classList.remove("hidden");
 box.scrollIntoView({behavior:"smooth"});
}

/* LOAD APPOINTMENTS */
async function loadAppointments(){
 const {data,error}=await db
  .from("appointments")
  .select("*")
  .order("appointment_date",{ascending:true})
  .order("appointment_time",{ascending:true});

 if(error){
  appointmentMsg("Appointments load failed: "+error.message);
  return;
 }

 appointments=data||[];
 renderAppointments();
}

/* RENDER APPOINTMENTS */
function renderAppointments(){
 const body=document.getElementById("appointmentRows");
 body.replaceChildren();

 const filter=val("appointmentFilterDate");

 const sorted=appointments.filter(a=>
  !filter||a.appointment_date===filter
 );

 sorted.forEach(a=>{
  const patient=patients.find(p=>
   String(p.id)===String(a.patient_id)
  );

  const tr=document.createElement("tr");

  const values=[
   patient?.full_name||"Patient not found",
   patient?.phone||"",
   a.appointment_date||"",
   String(a.appointment_time||"").slice(0,5),
   a.reason||"",
   a.status||"Scheduled"
  ];

  values.forEach((v,i)=>{
   const td=document.createElement("td");
   td.textContent=v;
   if(i===5)td.className="status";
   tr.appendChild(td);
  });

  const actions=document.createElement("td");

  const edit=document.createElement("button");
  edit.textContent="Edit";
  edit.onclick=()=>editAppointment(a);

  const del=document.createElement("button");
  del.textContent="Delete";
  del.className="danger";
  del.onclick=()=>deleteAppointment(a.id);

  actions.append(edit,del);
  tr.appendChild(actions);
  body.appendChild(tr);
 });

 if(!sorted.length){
  const tr=document.createElement("tr");
  const td=document.createElement("td");
  td.colSpan=7;
  td.textContent="No appointments found.";
  tr.appendChild(td);
  body.appendChild(tr);
 }
}

/* SAVE APPOINTMENT */
async function saveAppointment(){
 const patientId=val("appointment_patient");
 const date=val("appointment_date");
 const time=val("appointment_time");

 if(!patientId||!date||!time){
  alert("Please select a patient, date and time.");
  return;
 }

 const appointment={
  patient_id:Number(patientId),
  appointment_date:date,
  appointment_time:time,
  reason:val("appointment_reason"),
  status:val("appointment_status")||"Scheduled",
  notes:val("appointment_notes")
 };

 try{
  let result;

  if(editingAppointmentId!==null){
   result=await db
    .from("appointments")
    .update(appointment)
    .eq("id",editingAppointmentId);
  }else{
   appointment.id=Date.now();

   result=await db
    .from("appointments")
    .insert([appointment]);
  }

  if(result.error)throw result.error;

  appointmentMsg(
   editingAppointmentId!==null
   ?"Appointment updated successfully"
   :"Appointment saved successfully"
  );

  cancelAppointmentEdit();
  await loadAppointments();

 }catch(error){
  appointmentMsg("Appointment save failed: "+error.message);
 }
}

/* EDIT APPOINTMENT */
function editAppointment(a){
 editingAppointmentId=a.id;

 setVal("appointment_patient",a.patient_id);
 setVal("appointment_date",a.appointment_date);
 setVal("appointment_time",String(a.appointment_time||"").slice(0,5));
 setVal("appointment_reason",a.reason);
 setVal("appointment_status",a.status||"Scheduled");
 setVal("appointment_notes",a.notes);

 document.getElementById("appointmentFormTitle").textContent="Edit Appointment";
 document.getElementById("appointmentSaveButton").textContent="Update Appointment";
 document.getElementById("appointmentCancelButton").classList.remove("hidden");

 document.getElementById("appointmentsCard").scrollIntoView({behavior:"smooth"});
}

/* CANCEL APPOINTMENT EDIT */
function cancelAppointmentEdit(){
 editingAppointmentId=null;

 [
  "appointment_patient","appointment_date","appointment_time",
  "appointment_reason","appointment_notes"
 ].forEach(k=>setVal(k,""));

 setVal("appointment_status","Scheduled");

 document.getElementById("appointmentFormTitle").textContent="Appointment Management";
 document.getElementById("appointmentSaveButton").textContent="Save Appointment";
 document.getElementById("appointmentCancelButton").classList.add("hidden");
}

/* CLEAR APPOINTMENT FILTER */
function clearAppointmentFilter(){
 setVal("appointmentFilterDate","");
 renderAppointments();
}

/* DELETE APPOINTMENT */
async function deleteAppointment(id){
 if(!confirm("Are you sure you want to delete this appointment?"))return;

 const {error}=await db
  .from("appointments")
  .delete()
  .eq("id",id);

 if(error){
  appointmentMsg("Appointment delete failed: "+error.message);
  return;
 }

 appointmentMsg("Appointment deleted successfully");

 if(editingAppointmentId===id){
  cancelAppointmentEdit();
 }

 await loadAppointments();
}

/* CHECK LOGIN */
async function checkLogin(){
 if(!db)return;

 try{
  const {data:{session},error}=await db.auth.getSession();

  if(error||!session){
   document.getElementById("loginBox").classList.remove("hidden");
   document.getElementById("app").classList.add("hidden");
   return;
  }

  await showApp();

 }catch(error){
  console.log(error);
 }
}

/* AUTO LOGOUT WHEN PAGE RETURNS */
document.addEventListener("visibilitychange",()=>{
 if(!document.hidden && document.getElementById("app").classList.contains("hidden")===false){
  const startedAt=Number(sessionStorage.getItem("clinicLoginTime"));

  if(startedAt && Date.now()-startedAt>=SESSION_LIMIT_MS){
   logout();
  }
 }
});

/* START */
document.addEventListener("DOMContentLoaded",checkLogin);
</script>

</body>
</html>
