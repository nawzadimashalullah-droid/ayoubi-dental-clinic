
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayoubi Dental Clinic</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;color:#1e293b}
header{background:#075985;color:white;text-align:center;padding:24px}
main{max-width:900px;margin:25px auto;padding:12px}
.card{background:white;padding:20px;margin-bottom:20px;border-radius:12px;box-shadow:0 2px 8px #0001}
input,select,textarea{width:100%;padding:12px;margin:8px 0 15px;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:7px}
button{background:#0284c7;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer}
.delete{background:#dc2626}
.hidden{display:none}
table{width:100%;border-collapse:collapse;min-width:600px}
td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}
.tablewrap{overflow-x:auto}
#message{padding:10px;color:#075985}
</style>
</head>
<body>

<header>
<h1>🦷 Ayoubi Dental Clinic</h1>
<p>Patient Management System</p>
</header>

<main>

<div id="login" class="card">
<h2>Clinic Login</h2>
<label>Email</label>
<input id="email" type="email" placeholder="Your clinic email">
<label>Password</label>
<input id="password" type="password" placeholder="Your password">
<button id="loginBtn">Login</button>
</div>

<div id="app" class="hidden">

<div class="card">
<h2>Welcome to Ayoubi Dental Clinic</h2>
<button id="logoutBtn">Logout</button>
<p>Total Patients: <strong id="total">0</strong></p>
</div>

<div class="card">
<h2>Register New Patient</h2>
<form id="patientForm">
<label>Full Name</label>
<input id="name" required>

<label>Phone</label>
<input id="phone" type="tel">

<label>Age</label>
<input id="age" type="number" min="0">

<label>Gender</label>
<select id="gender">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<label>Chief Complaint</label>
<textarea id="complaint"></textarea>

<label>Medical History</label>
<textarea id="history"></textarea>

<label>Address</label>
<input id="address">

<button type="submit">Save Patient</button>
</form>
</div>

<div class="card">
<h2>Patient Records</h2>
<input id="search" placeholder="Search by name or phone">
<div class="tablewrap">
<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Age</th>
<th>Gender</th>
<th>Complaint</th>
<th>Action</th>
</tr>
</thead>
<tbody id="patientList"></tbody>
</table>
</div>
</div>
</div>

<p id="message"></p>
</main>

<script>
const SUPABASE_URL = "https://qrmgjgzgvbisuhqimqmd.supabase.co";
const SUPABASE_KEY = "sb_publishable_-VKLHhcBBx6DuKNokUkMLQ_wWWBchyh";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const message = document.getElementById("message");

function showMessage(text){
  message.textContent = text;
}

async function loadPatients(){
  const {data,error} = await db
    .from("Patients")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    showMessage("Could not load patients: " + error.message);
    return;
  }

  displayPatients(data || []);
}

function displayPatients(patients){
  const list = document.getElementById("patientList");
  const search = document.getElementById("search").value.toLowerCase();

  list.replaceChildren();

  const filtered = patients.filter(p =>
    (p.full_name || "").toLowerCase().includes(search) ||
    (p.phone || "").toLowerCase().includes(search)
  );

  document.getElementById("total").textContent = patients.length;

  filtered.forEach(p => {
    const tr = document.createElement("tr");

    [p.full_name,p.phone,p.age,p.gender,p.chief_complaint].forEach(value => {
      const td = document.createElement("td");
      td.textContent = value ?? "";
      tr.appendChild(td);
    });

    const td = document.createElement("td");
    const button = document.createElement("button");
    button.textContent = "Delete";
    button.className = "delete";

    button.onclick = async () => {
      if(!confirm("Delete this patient?")) return;

      const {error} = await db
        .from("Patients")
        .delete()
        .eq("id",p.id);

      if(error){
        showMessage(error.message);
      } else {
        showMessage("Patient deleted.");
        loadPatients();
      }
    };

    td.appendChild(button);
    tr.appendChild(td);
    list.appendChild(tr);
  });
}

async function checkLogin(){
  const {data,error} = await db.auth.getSession();

  if(error){
    showMessage(error.message);
    return;
  }

  const loggedIn = !!data.session;

  document.getElementById("login").classList.toggle("hidden",loggedIn);
  document.getElementById("app").classList.toggle("hidden",!loggedIn);

  if(loggedIn) loadPatients();
}

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    showMessage("Enter email and password.");
    return;
  }

  const {error} = await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    showMessage("Login failed: " + error.message);
  } else {
    showMessage("Login successful.");
    checkLogin();
  }
};

document.getElementById("logoutBtn").onclick = async () => {
  await db.auth.signOut();
  showMessage("Logged out.");
  checkLogin();
};

document.getElementById("patientForm").onsubmit = async (e) => {
  e.preventDefault();

  const patient = {
    full_name: document.getElementById("name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    age: document.getElementById("age").value
      ? Number(document.getElementById("age").value)
      : null,
    gender: document.getElementById("gender").value,
    chief_complaint: document.getElementById("complaint").value.trim(),
    medical_history: document.getElementById("history").value.trim(),
    address: document.getElementById("address").value.trim()
  };

  const {error} = await db
    .from("Patients")
    .insert([patient]);

  if(error){
    showMessage("Save failed: " + error.message);
  } else {
    showMessage("Patient saved successfully.");
    e.target.reset();
    loadPatients();
  }
};

document.getElementById("search").addEventListener("input",loadPatients);

db.auth.onAuthStateChange((event,session) => {
  if(event === "SIGNED_OUT"){
    document.getElementById("login").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
  }
});

checkLogin();
</script>
</body>
</html>
