
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayoubi Dental Clinic</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:15px;color:#172554}
.container{max-width:950px;margin:auto}
header{background:#087e8b;color:white;padding:20px;text-align:center;border-radius:12px;margin-bottom:15px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px #ddd}
input,select,textarea{width:100%;padding:11px;margin:7px 0 13px;box-sizing:border-box;border:1px solid #ccc;border-radius:7px}
button{padding:10px 14px;border:0;border-radius:7px;background:#087e8b;color:white;margin:3px;cursor:pointer}
button.danger{background:#c62828}
button.secondary{background:#64748b}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{border:1px solid #ddd;padding:9px;text-align:left}
th{background:#e0f2f1}
.table-wrap{overflow-x:auto}
.hidden{display:none}
#message{font-weight:bold;margin:10px 0}
</style>
</head>
<body>
<div class="container">
<header>
<h1>Ayoubi Dental Clinic</h1>
<p>Patient Management System</p>
</header>

<div class="card" id="loginBox">
<h2>Login</h2>
<label>Email</label>
<input id="email" type="email" placeholder="Enter email">
<label>Password</label>
<input id="password" type="password" placeholder="Enter password">
<button onclick="login()">Login</button>
</div>

<div id="app" class="hidden">
<div class="card">
<h2>Dashboard</h2>
<button onclick="logout()">Logout</button>
<p id="message"></p>
</div>

<div class="card">
<h2 id="formTitle">Register New Patient</h2>
<input id="full_name" placeholder="Patient Full Name">
<input id="phone" placeholder="Phone Number">
<input id="age" type="number" placeholder="Age">
<select id="gender">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>
<textarea id="chief_complaint" placeholder="Chief Complaint"></textarea>
<textarea id="medical_history" placeholder="Medical History"></textarea>
<textarea id="address" placeholder="Address"></textarea>
<button onclick="savePatient()" id="saveButton">Save Patient</button>
<button onclick="cancelEdit()" id="cancelButton" class="secondary hidden">Cancel Edit</button>
</div>

<div class="card">
<h2>Patient Records</h2>
<input id="search" placeholder="Search by name or phone" oninput="renderPatients()">
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Name</th><th>Phone</th><th>Age</th><th>Actions</th>
</tr>
</thead>
<tbody id="patientRows"></tbody>
</table>
</div>
</div>
</div>
</div>

<script>
const SUPABASE_URL = "https://qrmgjgzgvbisuhqimqmd.supabase.co";
const SUPABASE_KEY = "sb_publishable_-VKLHhcBBx6DuKNokUkMLQ_wWWBchyh";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let patients = [];
let editingId = null;

function msg(text){
 document.getElementById("message").textContent=text;
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error){alert(error.message);return;}
 document.getElementById("loginBox").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 await loadPatients();
 msg("Login successful");
}

async function logout(){
 await db.auth.signOut();
 document.getElementById("app").classList.add("hidden");
 document.getElementById("loginBox").classList.remove("hidden");
 patients=[];
 cancelEdit();
}

async function loadPatients(){
 const {data,error}=await db.from("Patients").select("*").order("id",{ascending:false});
 if(error){msg("Load failed: "+error.message);return;}
 patients=data||[];
 renderPatients();
}

function renderPatients(){
 const search=document.getElementById("search").value.toLowerCase();
 const body=document.getElementById("patientRows");
 body.replaceChildren();

 patients.filter(p=>
  String(p.full_name||"").toLowerCase().includes(search) ||
  String(p.phone||"").toLowerCase().includes(search)
 ).forEach(p=>{
  const tr=document.createElement("tr");
  const name=document.createElement("td");
  name.textContent=p.full_name||"";
  const phone=document.createElement("td");
  phone.textContent=p.phone||"";
  const age=document.createElement("td");
  age.textContent=p.age??"";
  const actions=document.createElement("td");

  const details=document.createElement("button");
  details.textContent="Details";
  details.onclick=()=>showDetails(p);

  const edit=document.createElement("button");
  edit.textContent="Edit";
  edit.onclick=()=>editPatient(p);

  const del=document.createElement("button");
  del.textContent="Delete";
  del.className="danger";
  del.onclick=()=>deletePatient(p.id);

  actions.append(details,edit,del);
  tr.append(name,phone,age,actions);
  body.appendChild(tr);
 });
}

function showDetails(p){
 alert(
  "Patient Details\n"+
  "Name: "+(p.full_name||"")+"\n"+
  "Phone: "+(p.phone||"")+"\n"+
  "Age: "+(p.age??"")+"\n"+
  "Gender: "+(p.gender||"")+"\n"+
  "Chief Complaint: "+(p.chief_complaint||"")+"\n"+
  "Medical History: "+(p.medical_history||"")+"\n"+
  "Address: "+(p.address||"")
 );
}

function editPatient(p){
 editingId=p.id;
 document.getElementById("full_name").value=p.full_name||"";
 document.getElementById("phone").value=p.phone||"";
 document.getElementById("age").value=p.age??"";
 document.getElementById("gender").value=p.gender||"";
 document.getElementById("chief_complaint").value=p.chief_complaint||"";
 document.getElementById("medical_history").value=p.medical_history||"";
 document.getElementById("address").value=p.address||"";
 document.getElementById("formTitle").textContent="Edit Patient";
 document.getElementById("saveButton").textContent="Update Patient";
 document.getElementById("cancelButton").classList.remove("hidden");
 window.scrollTo({top:0,behavior:"smooth"});
}

function cancelEdit(){
 editingId=null;
 ["full_name","phone","age","gender","chief_complaint","medical_history","address"].forEach(id=>{
  document.getElementById(id).value="";
 });
 document.getElementById("formTitle").textContent="Register New Patient";
 document.getElementById("saveButton").textContent="Save Patient";
 document.getElementById("cancelButton").classList.add("hidden");
}

async function savePatient(){
 const full_name=document.getElementById("full_name").value.trim();
 if(!full_name){alert("Please enter patient name");return;}

 const patient={
  full_name,
  phone:document.getElementById("phone").value.trim(),
  age:document.getElementById("age").value?Number(document.getElementById("age").value):null,
  gender:document.getElementById("gender").value,
  chief_complaint:document.getElementById("chief_complaint").value.trim(),
  medical_history:document.getElementById("medical_history").value.trim(),
  address:document.getElementById("address").value.trim()
 };

 let result;
 if(editingId!==null){
  result=await db.from("Patients").update(patient).eq("id",editingId);
 }else{
  result=await db.from("Patients").insert([patient]);
 }

 if(result.error){
  msg("Save failed: "+result.error.message);
  return;
 }

 msg(editingId!==null?"Patient updated successfully":"Patient saved successfully");
 cancelEdit();
 await loadPatients();
}

async function deletePatient(id){
 if(!confirm("Are you sure you want to delete this patient?"))return;
 const {error}=await db.from("Patients").delete().eq("id",id);
 if(error){msg("Delete failed: "+error.message);return;}
 msg("Patient deleted successfully");
 if(editingId===id)cancelEdit();
 await loadPatients();
}

async function checkLogin(){
 const {data:{session}}=await db.auth.getSession();
 if(session){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  await loadPatients();
 }
}

checkLogin();
</script>
</body>
</html>
